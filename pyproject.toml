[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "radioskysims-core"
version = "0.1.0"
description = "Kernel compartilhado do RadioSkySim: config, db, logging, paths, monitor, progress e domínio comum (common/geometry/tracks)."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
authors = [
  { name = "Luciano Barosi", email = "lbarosi@df.ufcg.edu.br" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.3",
  "astropy>=7.1",
  "xarray>=2022.3.1",
  "dask>=2025.5.1",
  "skyfield>=1.53,<2.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlmodel>=0.0.24",
  "psutil>=7.0",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/barosil/RadioSkySim"
"Bug Tracker" = "https://github.com/barosil/RadioSkySim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/radioskysims_core"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
